name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - release

jobs:
  compile:
    name: Typecheck & Export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Export web bundle
        run: npm run export:web
